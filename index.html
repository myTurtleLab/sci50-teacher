.tdm-speed input { width: 110px; accent-color: var(--tdm-primary); }

.tdm-choice input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--tdm-primary); }
.tdm-sub { color: var(--tdm-muted); }
.tdm-note { display: flex; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--tdm-status); border: 1px solid var(--tdm-btn-border); }
.tdm-note.tdm-warn { background: var(--tdm-warn-bg); border-color: var(--tdm-warn-border); }
.tdm-note svg { flex: none; margin-top: 1px; }
.tdm-mono { font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
.tdm-dl { margin: 0; display: grid; grid-template-columns: 150px 1fr; row-gap: 10px; column-gap: 12px; }
.tdm-dl dt { color: var(--tdm-muted); } .tdm-dl dd { margin: 0; }
.tdm-menu-list { display: flex; flex-direction: column; gap: 8px; }
.tdm-menu-list .tdm-btn { justify-content: space-between; }
.tdm-key { color: var(--tdm-muted); font-weight: 600; font-size: 14px; }
.tdm-menu-item-teacher { font-weight: inherit; }

@media (prefers-reduced-motion: reduce) { .tdm-chip.tdm-now { transform: none; } }

/* ---- not on the owner's sites, or offline: the teacher edition does not start ---- */
html.tdm-blocked #app, html.tdm-blocked .tdm-panel { display: none !important; }
html.tdm-blocked body { background: #1F2328; }
.tdm-block { box-sizing: border-box; max-width: 620px; margin: 10vh auto 0; padding: 28px 30px; border-radius: 18px;
  background: #23282E; color: #F3F4F6; border: 1px solid #3A414A; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.tdm-block h1 { margin: 0 0 12px; font-size: 24px; }
.tdm-block p { margin: 0 0 14px; }
.tdm-block a { color: #F0C27A; font-weight: 700; word-break: break-all; }
.tdm-block a:hover { color: #FFD9A0; }
.tdm-block .tdm-btn { margin-top: 6px; }

c:a.pc})}return e}var Pp=[{title:"Start here",open:!0,blocks:[["p","PracCalc works like a classic two-line programmable scientific calculator, with extra tools that the real calculator does not have. This guide explains those extra tools in detail, gives a short overview of normal calculator use, and shows step by step how to set up calculator programs."],["p","The ⋮ button at the top right opens the menu:"],["ul",[`Program Library — ${Ae.length} ready-made calculator programs you can put into the calculator with one tap, each with the keys to type it into the real calculator.`,"Theme — colours, your own photo, the calculator name and the orange line.",V("Settings — touch feedback, display contrast, screen time-out, key sound,","Settings — touch feedback, screen time-out, key sound,")+" Power Up Features (program banks, FMLA LOOK), calculator programs, diagnostic test.",V("Backup & Restore — save calculator programs, settings and calculator memory to a file, and restore them later or on another phone.","Backup & Restore — save calculator programs, settings and calculator memory to a file, and restore them later, in another browser or on another device."),"User Guide — this guide.","About — version, website, contact email, disclaimer, privacy policy and licences."]],["note","In this guide, “program” always means a calculator program: a short list of calculator commands kept in one of the calculator’s program areas P1–P4 and run with the [Prog] key, as on the real calculator. PracCalc itself is called “the app”."],["note","The app is not an examination-approved calculator. Do not use it where only approved calculators are allowed."]]},{group:"Part 1 · What this app adds",title:"Program Library: ready-made calculator programs",blocks:[["p","Menu → Program Library lists every calculator program. The 12 DSE default programs are always shown first. The others are grouped by topic: Finance, Algebra, Coordinate, Trigonometry, Geometry, Mensuration, Matrices & Vectors, Sequences, Probability, Statistics, Calculus, Number, Variation, Science and Date."],["ul",["Topics start folded. Tap a topic name (marked ▸, with its number of programs) to show its programs; tap it again to hide them.","Type in the search box (for example “triangle” or “binomial”) to filter. Every topic with a match opens by itself.",V("From a program page, ‹ at the top (or the phone’s Back button) returns to the list at that program, with its topic still open.","From a program page, ‹ at the top (or the browser’s Back button, or Esc) returns to the list at that program, with its topic still open.")]],["p","Every program was written for PracCalc and checked against worked examples. The 12 DSE default programs ask for values and show results in the same order as the DSE versions, so you enter the same values in the same order."],["p","Tap a program to see what it does, what to enter, what it shows and a worked example. Under “Put it on this calculator”:"],["ul",["Choose a bank (or “A new bank”), then tap P1, P2, P3 or P4.","Each area shows what is in it now and whether the program fits. A bank holds 680 bytes in total; if an area says “Needs 78 bytes, 40 free”, choose another area, another bank or a new bank.","Tapping an area that already holds a program asks before replacing it. Nothing else changes.","The message after placing tells you how to run it, for example: press [Prog], use [◀] [▶] to reach Bank 5, then press [1]."]],["p","Key-in instructions, just under the summary: tap the key icon to show every key, line by line, that types the program into the real calculator, plus the full program text. Tap it again to hide them."],["p","“Programs in the calculator” (at the top of the library, and in Settings) shows every bank and area. Use Remove to unplug a program, Info to open its library page, Delete Bank to remove a whole bank, and Export programs to save programs to a backup file (see “Backup & Restore”). This makes it easy to try a program, compare it with another, and take it out again before you type the one you like into your own calculator."],["note","Implication: placing or removing programs only changes program memory. Variables, statistics data, settings and other banks are not touched."]]},{title:"Banks: room for more calculator programs",blocks:[["p","The real calculator has one program memory: four areas, P1 to P4, sharing 680 bytes. This app keeps several such memories, called banks, so that more calculator programs can be stored. Each bank is exactly one real program memory, so everything in a bank fits a real calculator."],["ul",["The 12 DSE default programs come in Banks 1–4: P1–P4, P5–P6, P7–P10 and P11–P12.","On the Prog, RUN, EDIT and DEL screens, [◀] [▶] switch banks. In PRGM the screen shows, for example, “RUN Bank 2/4”; on the Prog screen (P1 P2 P3 P4) the bank number shows small at the left of the lower line, for example B2.","On the EDIT screen, going past the last bank opens a new empty bank. An empty new bank disappears again if you leave without saving a program in it.","With only one bank the screens look exactly like the real calculator.","Banks can be turned off: untick Program Bank x 4 in Settings → Power Up Features. The calculator then uses Bank 1 only, as the real calculator does; the other banks are kept, hidden, and come back when you tick it again."]],["note","Implication: the real calculator cannot switch banks. When you move programs to it, choose programs that together fit 680 bytes — one bank’s worth."]]},{title:"The 12 DSE default calculator programs and resetting",blocks:[["p","On first start the calculator holds the 12 DSE default programs (Banks 1–4). Settings → Restore the 12 DSE default programs puts them back at any time."],["note","Implication: Restore replaces every bank, so programs you added or wrote yourself are removed. Variables, statistics and settings are kept."],["p","CLR All ([SHIFT] [9] [3] [EXE]) behaves as on the real calculator: it clears memories, statistics, setup and all program memory, leaving one empty bank. Use Restore afterwards if you want the 12 programs back."]]},{title:"Copy and paste on the display",blocks:[["ul",["Touch and hold the lower part of the display (the answer) to Copy the result shown. Exponents are copied as E (e.g. 1.5E-07) and fractions with / so they paste into other apps.","Touch and hold the upper part (the input line) to Paste a calculation from the clipboard. Numbers, . + - × x * / ÷ ( ) are accepted; a minus at the start, after ( or after another sign becomes a negative sign; spaces and a trailing = are ignored; up to 99 characters.","If the clipboard holds anything else, the app says so and types nothing.","With a computer keyboard: Ctrl+C (⌘C on a Mac) copies the result shown and Ctrl+V (⌘V) pastes a calculation, with the same rules, while the menu is closed."]],["note","Implication: the app reads the clipboard only when you choose Paste or press Ctrl+V."]]},{title:"Using a computer keyboard",blocks:[["p","With a keyboard attached, each calculator key has a computer key. Letters work in small or capital letters. Alt+M opens or closes the menu and ? shows this list on its own page. In a menu page, Tab moves between the controls and Esc goes back one page."],["dl",On().map(t=>[t.shifted?`SHIFT ${t.legend}`:t.legend,t.pc.join(" or ")])]]},{title:"Settings",blocks:[["dl",[["Haptic tick","A short vibration on each key press. Turn off to save a little battery or for silence."],["Highlight active SHIFT / ALPHA layer","After [SHIFT] or [ALPHA], the legends that apply light up and the others dim, so you can see what the next key will do."],["Key hints","Shows a short message when a key does nothing in the current mode (for example i outside CMPLX) or when the calculator has something to tell you."],..._?[]:[["LCD contrast","Makes the display’s characters lighter or darker (00–1F, default 10). A small copy of the display shows the effect while you drag. The same value can be set on the calculator: [SHIFT] [MODE] (SETUP), [◀], [1], then [◀] lighter or [▶] darker and [AC] to finish; or press [+] / [-] while the MODE menu is open."]],["Keep screen on",V("System default lets the phone dim and lock as usual. 2, 5 or 30 minutes keep the screen fully bright for that long after your last key press. Never dim keeps it on while the app is open. Implication: longer times use more battery; the screen still turns off when you leave the app.","Shown only when the browser can keep the screen on. System default lets the device dim and lock as usual. 2, 5 or 30 minutes keep the screen on for that long after your last key press. Never dim keeps it on while the page is open and in front. Implication: longer times use more battery.")],["Key click sound and Click volume",V("A soft click on each key press, with its own volume. It plays through the phone’s media volume.","A soft click on each key press, with its own volume. It plays through the device’s sound output.")],["Power Up Features","Tick boxes for features this app adds to the calculator: Program Bank x 4 (ticked at first), FMLA “LOOK” with explanation and unit (not ticked at first) and Program help (ticked at first). See “Power Up Features” below."],["Calculator programs","Opens Programs in the calculator, Restore the 12 DSE default programs (see above) and Backup & Restore (also in the menu)."],["Run diagnostic test","A shortcut to the calculator’s own test mode; see “Diagnostic test” in Part 2."]]],["note",V("The (i) beside LCD contrast and beside Run diagnostic test shows the calculator keys that do the same thing.","The (i) beside Run diagnostic test shows the calculator keys that do the same thing. Display contrast is set on the calculator itself: [SHIFT] [MODE] (SETUP), [◀], [1], then [◀] lighter or [▶] darker and [AC] to finish; or press [+] / [-] while the MODE menu is open.")]]},{title:"Power Up Features",blocks:[["p","Settings → Power Up Features turns three app features on and off. With all unticked, program memory, FMLA and Prog work as on the real calculator."],["dl",[["Program Bank x 4 (ticked at first)","Program banks: more than one program memory (see “Banks” above). Unticked, the calculator has one program memory, Bank 1 (P1–P4, 680 bytes), and the Prog, EDIT, RUN and DEL screens read exactly as on the real calculator. The other banks are kept, hidden, and come back when you tick the box again. While it is unticked, the Program Library and Backup & Restore place programs in Bank 1 only, and CLR All empties Bank 1 only."],["FMLA “LOOK” with explanation and unit (not ticked at first)","As on a sister model of the calculator. While a built-in formula asks for its values, or when [▼] [▲] show its title at Formula No.?, press [SHIFT] [FMLA] (LOOK): the display shows the formula, for example 03:S=√(s(s-a)(s-b)(s-c)). [◀] [▶] scroll it; [AC], [EXE] or [SHIFT] [FMLA] again clear it and the prompt returns as it was. App extra: [▲] goes to the previous formula and [▼] to the next (after 23 comes 01), both at a value prompt and with the formula shown, so you can browse the formulas; the card changes with it. A card below the display says what the formula calculates, lists each value you enter and each result with its unit, and gives the values it accepts. Tap ✕ on the card to close it. When ticked, LOOK is printed above [FMLA]."],["Program help (ticked at first)","After [Prog], while P1 P2 P3 P4 show, a ? button appears to the left of the menu button (⋮) when at least one area holds a Program Library program. It lists the four areas with each program’s name and what it calculates; a program you wrote, or one you changed in the editor, shows as “User-defined program”. Tap a program there, or press ? while a Program Library program runs, for its inputs, outputs and a worked example; close the page and the program carries on where it was. A changed program gets no help, because it may no longer do what the library says. On a computer keyboard [F4] does the same as ?."]]],["note","Implication: the real calculator has none of these features. Untick all three to practise exactly as in an examination."]]},{title:"Theme",blocks:[["dl",[["Graphite Teal (dark)","The standard look: dark body, coloured function keys."],["Mist Light (light)",V("A light body for bright places.","A light body for bright places, in the colours and proportions of the real calculator: grey SHIFT, ALPHA, MODE and ON keys, orange Prog and FMLA keys and charcoal keys. On a wide screen the calculator keeps its own shape.")],["My Photos","Uses a photo of your own behind the keys. "+V("The Android photo picker opens; the app can only see the one photo you choose. A resized copy without location data is kept privately on the phone.","Choose the photo in the file chooser, or drop it on the calculator; the app reads only that file. A resized copy without location data is kept in this browser.")+" Use “Dim photo behind keys” to make the keys easier to read, “Key colours from the photo” (on by default) to tint each key with the colour of the photo behind it, “Replace photo” to choose another and “Delete photo” to remove the app’s copy ("+V("your original stays in your gallery","your original file is not touched")+"). The (i) beside My Photos and beside Delete photo opens a short explanation."],["Faceplate photo","A photo of the whole PracCalc keypad, 2100 × 3975 pixels (or any size with the same shape, width : height = 700 : 1325), with the display at the top and the bottom key row at the foot, becomes the keypad itself: the app hides its own keys, draws the display on the photo’s display window and puts the touch areas on the photo’s keys, so they line up on any screen. The calculator sits low on the screen, and the space above it takes the photo’s own top colour. It switches on by itself when you choose such a photo; turn “Use the photo’s keys as the keypad” off to use it as a background instead. While SHIFT or ALPHA is on, a ring marks that key."],["Automatic text contrast","On every theme, and especially over a photo, the app checks each label against what is behind it and adjusts its colour (or the dimming) so text stays readable."],["Calculator name","The large name at the top left, in italic, up to 20 characters; a long name gets smaller to fit. Reset returns it to PracCalc."],["Orange line","An optional line of orange text above the display, off by default. When turned on it starts with a sample; write your own, up to 40 characters. Type [] for a block and [[]] for a wide block."]]],["note","Implication: changing theme never changes calculator data. You are responsible for having the right to use any photo or text you add."]]},{title:V("Saving, Back button and your data","Saving, Back and your data"),blocks:[["ul",[V("Everything is saved automatically on the phone: memories, Ans, statistics data, setup, calculator programs and banks, and settings. Closing the app or restarting the phone keeps them.","Everything is saved automatically in this browser: memories, Ans, statistics data, setup, calculator programs and banks, and settings. Closing the page or restarting the device keeps them. A private window forgets them when it closes."),V("The phone’s Back button, like ‹ at the top of a page, goes back one page and closes the menu from its first page; ✕ closes it at once. On the calculator, Back leaves the app (your work is saved first).","The browser’s Back button (or a phone’s Back gesture), like ‹ at the top of a page and Esc, goes back one page and closes the menu from its first page; ✕ closes it at once. With the menu closed, Back leaves the page as usual (your work is saved first)."),..._?["Browser data is easier to lose than an app’s: clearing browsing data deletes it, and some browsers delete a site’s data after a long time without use. Settings → Data in this browser can ask the browser to keep it. The app reminds you, at most once a week, to export a backup when your programs have changed since the last one.","Only one copy of the calculator saves at a time. If it is already open in another tab or window, a second copy says so at the top and saves nothing.","Installing: the copy on the website can be installed (Add to Home Screen, or Install app in the browser menu). It then opens in its own window, works offline and keeps its data like an app. The downloaded file sci50.html also works offline when opened from your computer."]:[],"Fresh start: double tap the word PROGRAMMABLE at the top (or the space to its right). After you confirm, setup, memories, Ans, statistics and history are cleared and the calculator programs go back to the 12 DSE default programs; theme, calculator name and Settings are kept.","A blank display usually means the calculator is switched off ([SHIFT] [AC] is OFF, as on the real calculator). Press [ON]; the app reminds you if you press another key.",V("The app needs no account and does not connect to the internet. Uninstalling the app or clearing its storage deletes everything it saved, except backup files you saved yourself (see “Backup & Restore”).","The app needs no account and the calculator does not connect to the internet. Clearing this site’s data in the browser deletes everything it saved, except backup files you saved yourself (see “Backup & Restore”).")]]]},{title:"Backup & Restore",blocks:[["p",V("Menu → Backup & Restore saves your calculator programs and settings to a file (name ending .sci50) and reads them back. Android asks where to save or which file to open: a folder on the phone, or a document provider you use such as Google Drive. The app sees only the file you choose and never uploads anything itself.","Menu → Backup & Restore saves your calculator programs and settings to a file (name ending .json; files from earlier versions ending .sci50 still open) and reads them back. Where the browser has a save dialog, you choose the place and the app says “Backup saved” once the file is written; otherwise the file is downloaded where your browser keeps downloads and the app says “Backup file downloaded”. To import, choose a .sci50 file or drop it on the calculator. The app sees only the file you choose and never uploads anything itself.")],["dl",[["Export backup","Choose what to save, then tap “Save backup file…”. Full backup: every bank and program, all settings and the calculator memory (variables, Ans, setup, statistics data). Programs only: all banks, the banks you tick, or one program. Settings only: app settings, theme choice, calculator name, orange line and the calculator setup (angle unit, display format, fractions, complex format, statistics frequency, LCD contrast). The suggested name is like "+V("Sci50_Backup_2026-11-09.sci50","Sci50_Backup_2026-11-09.json")+"; you can change it."],["Import backup",V("Choose a .sci50 file.","Choose a backup file (.json, or .sci50 from earlier versions).")+" The app checks the whole file first and shows what it holds (type, date, app version, banks, programs) before anything changes. Closing the file picker changes nothing."],["Restoring a full backup","Shows how many banks and programs are "+V("on this phone","in this browser")+" and in the backup, then asks you to confirm. Everything is replaced: programs, settings and calculator memory. This cannot be undone, so export a backup first if you may want the current data back."],["Importing programs","Each program goes to a new bank by default (one new bank for each bank in the backup, same areas). For each program you can pick A new bank, a bank and area of your own, or Skip. A program that is already in the calculator (same mode and commands) is set to Skip. Choosing an area that holds a program asks before replacing it. If a bank would go over 680 bytes, or past 50 banks, nothing is imported and the app asks you to choose another place. Tick “Switch to imported bank” to make the first new bank the current one."],["Applying settings","Replaces the settings and calculator setup only. Programs, banks, variables and Ans are not changed."]]],["ul",["Programs from the Program Library are recognised by their commands and shown with their library names; changed or your own programs show as “Your own program”.","Not included: a My Photos picture, the calculation history and what is on the display. If a backup chooses My Photos and "+V("this phone","this browser")+" has no photo, Graphite Teal is used instead and the app tells you.","If something goes wrong while importing, the app puts back what you had and says “Import failed. Your existing data has been kept.”","Files larger than 5 MB, damaged files and files from a newer app version are refused with a message; nothing changes."]],["note","Implication: a backup file is an ordinary file. Anyone who has it can read your programs and settings, so keep it where only you can reach it. Backup files stay where you saved them when the app is uninstalled."]]},{title:"Differences from the real calculator",blocks:[["ul",["Program banks, the Program Library and Restore are app features. Program banks can be turned off (Settings → Power Up Features).","FMLA LOOK (Settings → Power Up Features, off at first) comes from a sister model; the real calculator has no LOOK, and its info card is an app feature.","At a calculator program’s ? prompt and at a built-in formula’s value prompt, the ordinary [-] key types a negative sign when nothing comes before it. On the real calculator use [(-)].","Built-in formula values accept any expression, e.g. (-2+1)×3.","Copy and paste, themes, sound, haptics and keep-screen-on are app features.","The diagnostic test is the real calculator’s; the Settings shortcut to it is an app feature, and its version screen shows the app’s version.","The number of contrast levels on the real calculator is not documented; the app uses 00–1F.","A test such as X=0 used after ⇒, If or While leaves Ans unchanged in this app, as published programs for this calculator rely on; the maker’s guide says the 1 or 0 goes into Ans. A program that reads Ans straight after a test may behave differently."]]]},{group:"Part 2 · Using the calculator (same as the real calculator)",title:"Calculations: an overview",blocks:[["p","Normal calculation works as on the real calculator, so only an overview is given here. The maker’s user’s guide for this calculator family describes every function in detail."],["dl",[["[ON], [AC], [DEL]","[ON] clears everything on screen; [AC] clears the input; [DEL] deletes, [SHIFT] [DEL] switches insert / overwrite."],["[SHIFT], [ALPHA]","Use the amber (SHIFT) or red (ALPHA) legend above the next key. ALPHA with a key gives the variables A, B, C, D, X, Y, M."],["Modes","[MODE] then [1] COMP (normal), [2] CMPLX (complex numbers), [3] BASE (binary, octal, hex), [4] SD (one-variable statistics), [5] REG (regression), [6] PRGM (programs)."],["Setup","[SHIFT] [MODE]: angle unit (Deg / Rad / Gra), display (Fix / Sci / Norm), fraction format, complex format, statistics frequency, contrast. [◀] [▶] change page."],["Memories","[SHIFT] [RCL] (STO) then a variable key stores; [RCL] recalls; [M+] / [SHIFT] [M+] add to / subtract from M. STO and M+ also set [Ans], the last answer. In SD and REG [M+] is DT, so M is not available."],["Replay","[▲] [▼] bring back earlier calculations to view or edit. While you type, [▲] jumps to the start of the expression and [▼] to the end."],["Errors","[AC] clears the calculation. [◀] or [▶] shows it again with the cursor at the error."],["Fractions","[a b/c] enters fractions and switches a result between fraction and decimal. A result worked out with fractions stays a fraction when it is used again (Ans, a variable, a program); a decimal point in the calculation gives a decimal."],["Constants","[SHIFT] [7] (CONST) chooses one of 40 scientific constants (not in BASE)."],["Built-in formulas","In COMP, [FMLA] shows Formula No.?. Type a two-digit number (01–23) to start that formula at once, or scroll with [▼] [▲] (the first [▼] gives 01) and press [EXE]. Then enter each value with [EXE]. With FMLA “LOOK” ticked in Settings → Power Up Features, [SHIFT] [FMLA] shows the formula and a card with its units, and [▲] [▼] at a value prompt go to the previous or next formula."],["BASE","The result shows d, H, b or o for the number base. DEC, HEX, BIN and OCT ([x²] [^] [log] [ln] in BASE) on a result convert it and keep the calculation on the upper line. A digit that does not exist in the base gives Syntax ERROR."],["Statistics","In SD or REG enter data with [M+] (DT); [SHIFT] [1] (S-SUM) and [SHIFT] [2] (S-VAR) give sums, means, standard deviations and regression values."],["Clear","[SHIFT] [9] (CLR): [1] memories (or statistics in SD/REG), [2] setup, [3] all, then [EXE] to clear or [AC] to cancel."]]]]},{title:"Calculator programs (P1–P4): what they are",blocks:[["ul",["A calculator program is a short list of commands that the calculator runs for you, for example to solve a triangle. There are four program areas, P1 to P4, sharing 680 bytes (one bank). The EDIT screen shows which areas are used and how many bytes are free.","Each program remembers its own mode (COMP, CMPLX, BASE, SD or REG) and runs in it.","Programs use the variables A, B, C, D, X, Y and M. “?” asks for a value, “→” stores it, “◢” shows a result and waits, and “:” separates statements.","Easiest start: Menu → Program Library, pick a program, tap a free area. Then run it as below."]]]},{title:"Calculator programs: run one with the Prog key",blocks:[["ol",["Press [Prog]. The screen shows P1 P2 P3 P4 over 1 2 3 4.","If you have more than one bank, press [◀] or [▶] until the right bank is shown (B1, B2 … at the lower left).","Press the area number [1]–[4].","At a prompt such as A? type the value and press [EXE]. For a negative value use [(-)] (in this app [-] also works).","When a result is shown and the program pauses, Disp lights; press [EXE] for the next one. The last result stays on screen when the program ends.","Press [AC] to stop a program early; the calculator goes back to the mode you ran it from.","If an error message appears, [◀] or [▶] opens the program in the editor with the cursor at the error; [AC] goes back to calculating."]]]},{title:"Calculator programs: write your own (worked example)",blocks:[["p","Example: area of a triangle from its three sides (Heron’s formula). The program is:"],["code","?→A:?→B:?→C:(A+B+C)÷2→D:√(D(D-A)(D-B)(D-C))"],["ol",["Press [MODE] [6] for PRGM. The screen shows EDIT RUN DEL.","Press [1] (EDIT). The screen shows P-1234 with a mark over each area in use, and the free bytes.","Choose an empty area by pressing its number. In this app all four areas of Bank 1 hold the built-in programs, so press [◀] once to open an empty new bank (EDIT Bank 5/5), then press [1].","Choose the run mode: [1] (COMP). The editor opens.","Type the first line ?→A: [SHIFT] [3] [1] gives ?, [SHIFT] [RCL] gives →, then [(-)] gives A (straight after → a variable key needs no [ALPHA]). Press [EXE] to type the “:”.","Type ?→B the same way with [°′″] for B, [EXE]; then ?→C with [hyp] for C, [EXE].","Type (A+B+C)÷2→D: [(] [ALPHA] [(-)] [+] [ALPHA] [°′″] [+] [ALPHA] [hyp] [)] [÷] [2] [SHIFT] [RCL] [sin], then [EXE].","Type √(D(D-A)(D-B)(D-C)): [√] [ALPHA] [sin] [(] [ALPHA] [sin] [-] [ALPHA] [(-)] [)] [(] [ALPHA] [sin] [-] [ALPHA] [°′″] [)] [(] [ALPHA] [sin] [-] [ALPHA] [hyp] [)] [)].","Press [AC] to finish. The program is saved. [EXE] now opens RUN Program.","Run it: [MODE] [1], [Prog] (Bank 5 is shown), [1], then 3 [EXE] 4 [EXE] 5 [EXE]. The answer is 6."]],["note","On the real calculator steps 1–4 are the same except that there is no bank: choose an empty area (delete one first if needed, see below)."]]},{title:"Calculator programs: edit, delete and program commands",blocks:[["dl",[["Edit","[MODE] [6] [1], then the area number. [◀] [▶] move the cursor, [▲] goes to the start and [▼] to the end, [DEL] deletes, [SHIFT] [DEL] switches insert / overwrite. [AC] saves the program and goes back to the EDIT Program screen."],["Delete","[MODE] [6] [3] (DEL), then the area number."],["Program commands","In the editor [SHIFT] [3] opens the program-command menu (P-CMD); [◀] [▶] turn its pages. Its nine pages hold: 1 ? → : ◢; 2 ⇒ = ≠; 3 > < ≥ ≤; 4 Goto Lbl; 5 While WhileEnd; 6 Next Break; 7 For To Step; 8 Else IfEnd; 9 If Then. The other commands are typed with their own keys: ClrMemory is typed with [SHIFT] [9] (CLR) [1] (Mem) in a COMP, CMPLX or BASE program, and ClrStat with [SHIFT] [9] [1] (Stat) in an SD or REG program. [SHIFT] [MODE] (SETUP) in the editor types the setting as a command instead of changing it: [1] Deg, [2] Rad, [3] Gra; [▶] [1] then a digit types Fix 0 to Fix 9, [▶] [2] Sci, [▶] [3] [1] or [2] Norm 1 or Norm 2; [▶] [▶] [1] or [2] FreqOn or FreqOff. In the editor SETUP has only these three pages. [M+] types M+ ([SHIFT] [M+] M-, DT in an SD or REG program), and in a BASE program [x²] [^] [log] [ln] type Dec, Hex, Bin, Oct. Every command takes one byte, as on the real calculator."],["Store →","[SHIFT] [RCL] (STO) types the → arrow; the variable key after it needs no [ALPHA]."],["Statistics in a program","In an SD or REG program [M+] types DT, and [SHIFT] [1] / [SHIFT] [2] type the statistics."],["M+ and M− in a program","M+ or M− on its own adds or subtracts the value last worked out: Ans, or 1 right after a true test, so While M≥0 : M− counts M down. M−→Y also stores the value in Y."],["Tests and Ans","A test such as A>0 used after ⇒, If or While leaves Ans as it was. A false ⇒ skips the statement after it, its ◢ included."]]],["p","Tips:"],["ul",["Every Program Library page has Key-in instructions (tap the key icon) with the exact keys for each line — the quickest way to learn which keys give which command.","Write a multiplication sign before nCr or nPr terms, e.g. A nCr X×B nCr Y: a missing × binds tighter than nCr.","The power key types ^( : close it, e.g. B^(C).","Try a program in the app first, then type it into your own calculator: put it in an area, run it with the library’s example, then follow its key-in guide."]]]},{title:"Diagnostic test (the calculator’s hidden test mode)",blocks:[["p",V("The real calculator has a hidden test mode, and the app copies it. Hold [SHIFT] and [7] and press [ON]. Press [ON] at any step to leave.","The real calculator has a hidden test mode, and the app copies it. On a touch screen, hold [SHIFT] and [7] and press [ON]. With a mouse or a keyboard, which cannot hold one key while pressing another, switch the calculator off ([SHIFT] [AC]), then press [SHIFT], [7] and [ON] one after another. Press [ON] at any step to leave.")],["ul",["Press [9] for the display test. Each [SHIFT] shows the next pattern (all on, two checkerboards, all off); [SHIFT] after the last pattern shows the software version.","Press [AC] for display contrast: [◀] [▶] change it, [AC] saves it.","Then press every key in order as asked; the counter goes up for each right key. “TEST OK” ends the test."]],["note","App extra: Settings → Run diagnostic test starts the same test without the key chord."]]}];function Qk(t){let e=n=>{let a=[],s=/\[([^\]]+)\]/g,o=0,k;for(;k=s.exec(n);)k.index>o&&a.push(n.slice(o,k.index)),a.push(t("kbd",{class:"key"+(k[1]==="SHIFT"?" k-sh":k[1]==="ALPHA"?" k-al":"")},k[1])),o=s.lastIndex;return o<n.length&&a.push(n.slice(o)),a},r=([n,a])=>n==="p"?t("p",{},...e(a)):n==="note"?t("p",{class:"note"},...e(a)):n==="code"?t("pre",{class:"example"},a):n==="ul"||n==="ol"?t(n,{class:"guide-list"},...a.map(s=>t("li",{},...e(s)))):n==="dl"?t("dl",{class:"guide-dl"},...a.flatMap(([s,o])=>[t("dt",{},...e(s)),t("dd",{},...e(o))])):null;return Pp.flatMap(n=>[n.group?t("h3",{class:"guide-group"},n.group):null,t("details",{class:"guide-sec",open:!!n.open},t("summary",{},n.title),...n.blocks.map(r))].filter(Boolean))}var Un="° (degrees)",Vn="θ is read in the angle unit set in SETUP (Deg, Rad or Gra); the published formula list gives degrees.",Va="g = 9.80665 m/s² (standard gravity).",Jk={1:{title:"Quadratic Equation Solution",about:"Solves her photos or files and does not use the camera. The chosen photo is resized and saved again without its original metadata (such as location and camera details), kept privately on your phone, never uploaded, and excluded from Android backups. Delete photo (Menu → Theme) removes it."],["Clipboard","The app reads the clipboard only when you touch and hold the display and choose Paste, and writes to it only when you choose Copy. Clipboard content is used only to type a calculation or to copy a result and is not kept or sent anywhere."],["Android permissions","Vibrate: for the optional haptic tick on key presses. Internet: declared by the app package, but the app makes no network connections and sends no data. The app requests no access to location, contacts, camera, microphone, storage, or other personal information. Backup & Restore uses the Android file picker, which lets the app read or write only the one file you choose, without any storage permission."],["Backup files you export","Menu → Backup & Restore can save your calculator programs, settings and calculator memory to a .sci50 file, and read such a file back. You choose where the file goes: a folder on your phone or a document provider such as your own cloud storage. Any upload is done by that provider under its own terms; the app itself makes no network connection and we never receive the file. The file is not encrypted, so anyone who has it can read its contents. The theme photo is never included."],["Android backup","If Android backup is turned on for your phone, Android may include the app’s settings and calculator data in your own Google backup so they can be restored on a new phone. This is controlled by your phone’s settings and Google’s terms; we cannot see that backup. The theme photo is never included."],["Emails you send us","If you email us comments or a bug report, we receive your email address and whatever you write. We use it only to read and reply to your message and to improve the app, keep it only as long as needed for that purpose, and do not share it except where the law requires. You may ask us to delete it at any time."],["Keeping and deleting data","Data on your phone stays until you change or delete it in the app, use CLR All, clear the app’s storage in Android settings, or uninstall the app; any of these deletes it permanently. We hold no copy, so we cannot restore it. Backup files you exported stay where you saved them until you delete them."],["Security","Data is kept in the app’s private storage protected by Android. Because the app transmits no data, none of it is exposed in transit."],["Children","The app is a general calculator for students and adults. It collects no personal information from anyone, including children."],["Changes to this policy","If this policy changes, the new version will appear in the app (Menu → About → Privacy policy) and at the address given in the app’s Google Play listing, with a new effective date."],["Effective date",Sp]],Ip="15 November 2026",Lp="https://myturtlelab.github.io/sci50-html/",ti=[["Who we are","This privacy policy applies to the web version of PracCalc (formerly Sci-50 programmable; the “app”): the single file sci50.html and the copy hosted at "+Lp+", published by Neo Time Consulting, Hong Kong (“we”, “us”). Questions about this policy or your data: "+nr+"."],["Summary","The app does not collect, store on our servers, sell or share any personal data. It has no account, no sign-in, no advertising, no analytics and no tracking, and the calculator itself makes no network connections: its built-in security policy blocks them. Everything the app keeps stays in your browser on your device, unless you save a backup file yourself. Opening the hosted copy is an ordinary web request to GitHub Pages (see “Hosting”)."],["Data kept in your browser","To work as a calculator the app saves, only in your browser’s storage on your device: its settings, calculator memory (variables, answer, statistics data, setup), the programs you store, when you last exported a backup, and, if you use My Photos, one copy of the photo you choose. This data is not sent to us or to anyone else, and other websites cannot read it. If you open the downloaded file sci50.html from your computer, some browsers (for example Chrome) give every HTML file opened from the computer one shared storage area, so another HTML file you open the same way could read this data."],["Hosting","The hosted copy is served by GitHub Pages. When you open it, GitHub logs your IP address for security purposes under the GitHub Privacy Statement; we receive no information about individual visitors. If you install the hosted copy (Add to Home Screen or Install app), your browser keeps the app’s files so it works offline, and while you are online it may ask GitHub Pages for a newer version when you open the app. The downloaded file sci50.html makes no such request."],["Photos","When you choose My Photos, the app reads only the one image file you pick in the file chooser or drop on the calculator. It has no access to your other files and does not use the camera. The image is turned upright, resized and saved again without its original metadata (such as location and camera details), kept in your browser’s storage, and never uploaded. Delete photo (Menu → Theme) removes it."],["Clipboard","The app reads the clipboard only when you touch and hold the display and choose Paste (your browser may ask for permission first) or when you press Ctrl+V (⌘V); it writes to it only when you choose Copy or press Ctrl+C (⌘C). Clipboard content is used only to type a calculation or to copy a result and is not kept or sent anywhere."],["Browser features used","Vibration for the optional haptic tick (where the browser supports it), the screen wake lock for Keep screen on, persistent storage only when you choose “Ask the browser to keep my data” in Settings, and the browser’s save dialog or download for backups. The app asks for no access to location, contacts, camera, microphone or notifications."],["Backup files you export","Menu → Backup & Restore can save your calculator programs, settings and calculator memory to a .json file, and read such a file back (or a .sci50 file from an earlier version). The file goes where you choose in the save dialog, or where your browser saves downloads. The app never uploads it and we never receive it. The file is not encrypted, so anyone who has it can read its contents. The theme photo is never included."],["Emails you send us","If you email us comments or a bug report, we receive your email address and whatever you write. We use it only to read and reply to your message and to improve the app, keep it only as long as needed for that purpose, and do not share it except where the law requires. You may ask us to delete it at any time."],["Donations","About has an optional donation link. It opens the donation page at buymeacoffee.com in a new browser tab; the app sends nothing to that site. If you choose to donate, that site handles the payment and your details under its own privacy policy, and we see only what it shows us about a donation. Donating unlocks nothing in the app."],["Keeping and deleting data","Data in your browser stays until you change or delete it in the app, use CLR All, or clear this site’s data in your browser settings. A browser may also delete it by itself, for example when storage runs low or after a period without use, and a private window deletes it when closed. We hold no copy, so we cannot restore it: export a backup to keep your programs safe. Backup files you exported stay where you saved them until you delete them."],["Security","Data is kept in your browser’s storage, which other websites cannot read. Because the app transmits no data, none of it is exposed in transit."],["Children","The app is a general calculator for students and adults. It collects no personal information from anyone, including children."],["Changes to this policy","If this po   /** Work out every step of a file's sections on a spare engine (FR-DEMO-82). */
  function trialRun(file, budgetMs) {
    const t0 = performance.now();
    const tpl = C.templateOf(new M.constructor());
    C.checkFile(file, tpl);
    return file.sections.map((fs) => {
      const sb = new M.constructor();
      const state = stateFromDurable(fs.start.state);
      for (const k of Object.keys(state)) sb[k] = deepCloneFree(state[k]);
      applyBehaviour(sb, fs.behaviour);
      const steps = [];
      fs.keys.forEach((id, i) => {
        if (performance.now() - t0 > budgetMs) throw new C.FileError('time');
        const pre = preState(sb);
        const feed = fs.random[i].slice();
        withRandom(feed, null, () => pressOriginal.call(sb, id));
        steps.push(describeStep(id, pre, postState(sb), fs.random[i].slice()));
      });
      return { origin: 'file', start: { exact: null, durable: fs.start.state, clean: fs.start.cleanStart, history: 0 },
        behaviour: { pwrBanks: fs.behaviour.pwrBanks, pwrLook: fs.behaviour.pwrLook }, steps,
        usesPrograms: steps.some((s) => s.id === 'PROG') };
    });
  }
  function deepCloneFree(v) { return deepClone(v, new Map()); }

  function readFileText(file) {
    return new Promise((resolve, reject) => {
      if (file.size > C.LIMITS.fileBytes) { reject(Object.assign(new C.FileError('size'), { why: 'size' })); return; }
      file.arrayBuffer().then((buf) => {
        try { resolve(new TextDecoder('utf-8', { fatal: true }).decode(buf)); }
        catch { reject(Object.assign(new C.FileError('utf8'), { why: 'utf8' })); }
      }, () => reject(Object.assign(new Error('read'), { why: 'read' })));
    });
  }
  async function importFile(file) {
    if (play.active) endPlayback(true);
    let text;
    try { text = await readFileText(file); }
    catch (e) {
      if (e.why === 'read') return setStatus('Could not read the selected demonstration file.');
      return setStatus('This is not a valid PracCalc demonstration file.' + (e.why === 'size' ? ' (larger than 2 MB)' : ' (not UTF-8 text)'));
    }
    let json, sections;
    try { json = JSON.parse(text); } catch { return setStatus('This is not a valid PracCalc demonstration file.'); }
    try { sections = trialRun(json, 5000); }
    catch (e) {
      if (e instanceof C.FileError && e.message === 'version' && e.newer) return setStatus('This demonstration was saved by a newer version of PracCalc. Update this file to open it.');
      if (e instanceof C.FileError && e.message !== 'time') { console.warn('Demonstration file refused:', e.message); return setStatus('This is not a valid PracCalc demonstration file.'); }
      return setStatus('This demonstration could not be played on this calculator. Nothing was changed.');
    }
    importPreview(json, sections, file.name);
  }

  async function saveFile(name, text) {
    if (window.showSaveFilePicker && window.top === window) {
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'PracCalc demonstration', accept: { 'application/json': ['.json'] } }] });
        const w = await handle.createWritable(); await w.write(text); await w.close();
        return 'Demonstration saved';
      } catch (e) {
        if (e && e.name === 'AbortError') return null;      // dialog closed: nothing changes, no message
      }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return 'Demonstration file downloaded (' + name + '). Your browser saved it where it keeps downloads, usually the Downloads folder.';
  }

  // ------------------------------------------------------------------------------------
  // Layout (FR-DEMO-10 to -13): the calculator keeps the left part (or the top part)
  // ------------------------------------------------------------------------------------
  const appEl = $('#app'), calcEl = $('#calc');
  // The core sizes the calculator from the window size. While the panel is shown, the
  // window size it reads is the area left for the calculator, so it lays itself out
  // exactly as it would in a window of that size (same zoom rule, FR-WEB-60).
  const viewDesc = { w: Object.getOwnPropertyDescriptor(window, 'innerWidth'), h: Object.getOwnPropertyDescriptor(window, 'innerHeight') };
  const realW = () => (viewDesc.w && viewDesc.w.get ? viewDesc.w.get.call(window) : document.documentElement.clientWidth);
  const realH = () => (viewDesc.h && viewDesc.h.get ? viewDesc.h.get.call(window) : document.documentElement.clientHeight);
  let area = null;
  let sizeOverride = false;
  try {
    if (viewDesc.w && viewDesc.w.get && viewDesc.h && viewDesc.h.get) {
      Object.defineProperty(window, 'innerWidth', { configurable: true, get: () => (area ? area.w : realW()) });
      Object.defineProperty(window, 'innerHeight', { configurable: true, get: () => (area ? area.h : realH()) });
      sizeOverride = true;
    }
  } catch { sizeOverride = false; }
  // fallback where the window size cannot be presented: set the zoom here instead
  let myZoom = '';
  new MutationObserver(() => { if (!sizeOverride && area && myZoom && calcEl.style.zoom !== myZoom) calcEl.style.zoom = myZoom; })
    .observe(calcEl, { attributes: true, attributeFilter: ['style'] });
  let inLayout = false;
  function layout() {
    if (inLayout) return;
    inLayout = true;
    try {
      const W = realW(), H = realH();
      const show = ui.shown && W >= MIN_WIDTH;
      document.body.classList.toggle('tdm-on', show);
      document.body.classList.toggle('tdm-light', lightTheme());
      panel.hidden = !show;
      if (!show) {
        appEl.style.width = ''; appEl.style.height = ''; area = null; myZoom = '';
      } else {
        if (!ui.position) ui.position = W >= H ? 'right' : 'below';
        const right = ui.position !== 'below';
        let aw, ah;
        if (right) {
          aw = Math.max(360, Math.round(W * 0.42)); ah = H;
          Object.assign(panel.style, { left: (aw + 4) + 'px', top: '12px', right: '12px', bottom: '12px' });
        } else {
          const ph = Math.round(Math.max(230, Math.min(360, H * 0.31)));
          aw = W; ah = H - ph - 26;
          Object.assign(panel.style, { left: '12px', right: '12px', bottom: '12px', top: (ah + 14) + 'px' });
        }
        appEl.style.width = aw + 'px'; appEl.style.height = ah + 'px';
        area = { w: aw, h: ah };
        if (!sizeOverride) { myZoom = String(Math.round(Math.max(0.6, Math.min(aw / 520, ah / 860, 2)) * 100) / 100); calcEl.style.zoom = myZoom; }
        posBtn.replaceChildren(icon(right ? 'right' : 'below', 18), h('span', { text: right ? 'Record: right' : 'Record: below' }));
      }
      window.dispatchEvent(new Event('resize'));          // the core lays the calculator out again
    } finally { inLayout = false; }
  }
  window.addEventListener('resize', layout);

    openDialog('Import demonstration', body, [dbtn('Cancel', () => closeDialog()), dbtn('Load demonstration', () => {
      if (totalSteps()) confirmDialog('Replace the current key record (' + totalSteps() + ' steps)? Export it first if you want to keep it.', 'Replace', load);
      else load();
    }, true, 'import')]);
  }

  function teacherMenu() {
    const item = (label, key, fn, disabled) => {
      const b = h('button', { type: 'button', class: 'tdm-btn', disabled: !!disabled, onclick: () => { closeDialog(); fn(); } }, h('span', { text: label }), key ? h('span', { class: 'tdm-key', text: key }) : null);
      return b;
    };
    const any = totalSteps() > 0;
    const speed = h('input', { type: 'range', min: '0.2', max: '2.5', step: '0.1', value: String(ui.speed), 'aria-label': 'Seconds for each step' });
    const sv = h('span', { text: Number(ui.speed).toFixed(1) + ' s' });
    speed.addEventListener('input', () => { ui.speed = Number(speed.value); sv.textContent = ui.speed.toFixed(1) + ' s'; speedInput.value = speed.value; speedVal.textContent = sv.textContent; saveUi(); });
    openDialog('Teacher demonstration', [
      h('p', { text: 'Record the keys you press, play them back for the class, and save them to a file to use again.' }),
      h('div', { class: 'tdm-menu-list' },
        item(ui.shown ? 'Hide key record' : 'Show key record', 'F8', () => setShown(!ui.shown)),
        item(play.active && !play.paused && !play.finished ? 'Pause' : 'Play', 'F9', () => playPauseKey(), !any),
        item('Step', 'Ctrl+→', () => stepKey(), !any),
        item('Stop', 'Shift+F9', () => endPlayback(true), !play.active),
        item('Undo last step', 'Ctrl+Z', () => undo(), !any || play.active),
        item('Clear key record', '', () => clearRecord(), !any || play.active),
        item('Copy steps as text', '', () => copyText(), !any),
        item('Export demonstration…', '', () => exportDialog(), !any || play.active),
        item('Import demonstration…', '', () => pickFile(), false),
        item(ui.position === 'below' ? 'Put the key record on the right' : 'Put the key record below', '', () => { ui.position = ui.position === 'below' ? 'right' : 'below'; saveUi(); layout(); }, false)),
      h('label', { class: 'tdm-speed' }, 'Each step ', speed, sv),
      h('p', { class: 'tdm-sub', text: 'Teacher edition ' + TEACHER_VERSION + ' of PracCalc (formerly Sci-50 programmable) ' + CORE_VERSION + ' (web).' })
    ], null);
  }

  // The notice the student file shows at first start, here behind (i) (owner decision, 20 Nov 2026)
  const NOTICE = "PracCalc is provided free of charge and 'as is', without warranty of any kind. Neo Time Consulting does not guarantee that results, programs or stored data are correct or complete and, to the fullest extent the law allows, is not liable for any loss or damage arising from use of, or inability to use, the app. Check any result that matters by another method. The app is not an examination-approved calculator and must not be used where only approved calculators are allowed. It is not affiliated with or endorsed by any calculator maker or examination authority. A photo you load as a theme stays in this browser on your device; you are responsible for having the right to use it, and for any name or text you enter for the calculator display.";
  function noticeDialog() {
    openDialog('Notice', [
      h('p', { text: NOTICE }),
      h('p', { class: 'tdm-sub', text: 'Teacher edition ' + TEACHER_VERSION + ' of PracCalc (formerly Sci-50 programmable) ' + CORE_VERSION + ' (web). © 2026 Neo Time Consulting. All rights reserved.' })
    ], [dbtn('About the calculator', () => { closeDialog(); openCoreAbout(); }), dbtn('Close', () => closeDialog(), true)]);
  }
  function openCoreAbout() {
    const mb = $('#menu-btn'); if (!mb) return;
    mb.click();
    setTimeout(() => {
      const b = [...document.querySelectorAll('#sheet-body button, #sheet-body a')].find((x) => /^\s*About\b/.test(x.textContent));
      if (b) b.click();
    }, 60);
  }

  // (i) button on the left of the menu button
  const infoBtn = h('button', { type: 'button', class: 'menu-btn tdm-info-btn', 'aria-label': 'Notice and version', title: 'Notice and version', 'aria-haspopup': 'dialog', onclick: () => noticeDialog() });
  infoBtn.append(icon('info', 22));
  infoBtn.firstChild.innerHTML = '<circle class="tdm-ring" cx="12" cy="12" r="9.5"></circle><path class="tdm-stem" d="M12 11v6"></path><circle class="tdm-idot" cx="12" cy="7.4" r="1.3"></circle>';
  const menuBtn = $('#menu-btn');
  if (menuBtn) menuBtn.before(infoBtn);

  // "Teacher demonstration" at the top of the core's menu (FR-DEMO-07)
  const sheetBody = $('#sheet-body');
  if (sheetBody) {
    new MutationObserver(() => {
      if (($('#sheet-title') || {}).textContent !== 'Menu' || sheetBody.querySelector('.tdm-menu-item-teacher')) return;
      const first = sheetBody.querySelector('button');
      if (!first) return;
      const item = first.cloneNode(false);
      item.classList.add('tdm-menu-item-teacher');
      item.removeAttribute('id');
      item.textContent = 'Teacher demonstration';
      item.addEventListener('click', (e) => { e.stopPropagation(); const c = $('#sheet-close'); if (c) c.click(); setTimeout(teacherMenu, 30); });
      first.before(item);
    }).observe(sheetBody, { childList: true, subtree: true });
  }

  // Keys (FR-DEMO-90): F8, F9, Shift+F9, Ctrl+→, Ctrl+Z
  window.addEventListener('keydown', (e) => {
    if (dialog) return;
    const inText = e.target && e.target.closest && e.target.closest('input:not([type=range]), textarea, select');
    const sheetOpen = !$('#sheet').hidden;
    let act = null;
    if (e.key === 'F8' && !e.ctrlKey && !e.altKey) act = () => setShown(!ui.shown);
    else if (e.key === 'F9' && !e.shiftKey && ui.shown) act = () => playPauseKey();
    else if (e.key === 'F9' && e.shiftKey && ui.shown) act = () => endPlayback(true);
    else if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowRight' && ui.shown && !inText) act = () => stepKey();
    else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z') && ui.shown && !inText && !sheetOpen) act = () => undo();
    if (!act) return;
    e.preventDefault(); e.stopImmediatePropagation();
    act();
  }, true);

  // A .json file dropped on the page: a demonstration is imported, anything else goes to the core as before
  window.addEventListener('drop', (e) => {
    if (e.__tdmPass) return;
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f || !/\.json$/i.test(f.name)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    readFileText(f).then((text) => {
      let j = null; try { j = JSON.parse(text); } catch { /* not ours */ }
      if (j && j.format === 'sci50-demo') { importFile(f); return; }
      const dt = new DataTransfer(); dt.items.add(f);
      const ev = new DragEvent('drop', { dataTransfer: dt, bubbles: true, cancelable: true });
      ev.__tdmPass = true;
      window.dispatchEvent(ev);
    }, () => { const dt = new DataTransfer(); dt.items.add(f); const ev = new DragEvent('drop', { dataTransfer: dt, bubbles: true, cancelable: true }); ev.__tdmPass = true; window.dispatchEvent(ev); });
  }, true);

  // Pause playback while a core menu page is open (FR-DEMO-47)
  const sheet = $('#sheet');
  if (sheet) new MutationObserver(() => { if (!sheet.hidden) pausePlayback(); }).observe(sheet, { attributes: true, attributeFilter: ['hidden'] });

  // ------------------------------------------------------------------------------------
  // Start
  // ------------------------------------------------------------------------------------
  document.title = 'PracCalc DSE practice calculator — Teacher edition';
  speedInput.value = String(ui.speed); speedVal.textContent = Number(ui.speed).toFixed(1) + ' s';
  loadRecord();
  layout();
  changed(true);

  // console and test access (read-only views and the panel's own actions)
  Object.defineProperty(window, 'sci50teacher', { value: Object.freeze({
    version: TEACHER_VERSION, coreVersion: CORE_VERSION,
    record: () => JSON.parse(JSON.stringify({ title: rec.title, sections: rec.sections.map((s) => ({ origin: s.origin, clean: s.start.clean, steps: s.steps.map((x) => Object.assign({}, x)) })) })),
    copyText: () => C.copyText(rec.title, rec.sections), buildFile: (t, p) => buildFile(t, p),
    show: setShown, play: () => startPlayback(false), step: stepKey, stop: () => endPlayback(true), pause: pausePlayback,
    undo, playState: () => ({ active: play.active, paused: play.paused, finished: play.finished, pos: play.pos }),
    importText: (text, name) => importFile(new File([text], name || 'demo.json', { type: 'application/json' })),
    fingerprint, isDialogOpen: () => !!dialog
  }) });
})();
</script>
</body>
</html>
